<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wincontrol · Acceso</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap');

    :root {
      --bg: #020617;
      --panel: #0b1220;
      --panel-2: #0e1626;
      --border: #162032;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --muted2: #64748b;
      --blue: #2563eb;
      --emerald: #10b981;
      --red: #dc2626;
      --violet: #8b5cf6;
      --radius: 16px;
    }

    body.light {
      --bg: #f6f5f2;
      --panel: #ffffff;
      --panel-2: #f4f3ef;
      --border: #e4e2da;
      --text: #0a0a0a;
      --muted: #6b6a63;
      --muted2: #98968d;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(37,99,235,.18), transparent 60%),
        radial-gradient(900px 500px at 85% 10%, rgba(139,92,246,.10), transparent 55%),
        radial-gradient(600px 400px at 50% 100%, rgba(37,99,235,.06), transparent 60%),
        var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      padding-top: max(40px, calc(env(safe-area-inset-top, 0px) + 24px));
      padding-bottom: max(40px, calc(env(safe-area-inset-bottom, 0px) + 24px));
      position: relative;
      overflow: hidden;
      transition: background-color .2s ease, color .2s ease;
    }
    body.light {
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(37,99,235,.06), transparent 60%),
        radial-gradient(900px 500px at 85% 10%, rgba(139,92,246,.04), transparent 55%),
        radial-gradient(600px 400px at 50% 100%, rgba(37,99,235,.03), transparent 60%),
        var(--bg);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(37,99,235,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37,99,235,.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }
    body.light::before {
      background-image:
        linear-gradient(rgba(37,99,235,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37,99,235,.03) 1px, transparent 1px);
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(80px);
      animation: drift 12s ease-in-out infinite alternate;
    }
    .orb-1 { width: 400px; height: 400px; background: rgba(37,99,235,.12); top: -100px; left: -100px; }
    .orb-2 { width: 300px; height: 300px; background: rgba(139,92,246,.10); bottom: -80px; right: -80px; animation-delay: -4s; }
    .orb-3 { width: 200px; height: 200px; background: rgba(16,185,129,.06); top: 50%; left: 60%; animation-delay: -8s; }
    body.light .orb-1 { background: rgba(37,99,235,.06); }
    body.light .orb-2 { background: rgba(139,92,246,.05); }
    body.light .orb-3 { background: rgba(16,185,129,.04); }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(30px, 20px) scale(1.05); }
    }

    .theme-toggle {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 20px);
      right: calc(env(safe-area-inset-right, 0px) + 20px);
      z-index: 20;
      width: 52px;
      height: 28px;
      padding: 3px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(2,6,23,.55);
      cursor: pointer;
      transition: border-color .2s ease, background-color .2s ease;
    }
    .theme-toggle:hover { border-color: rgba(37,99,235,.4); }
    body.light .theme-toggle { background: var(--panel-2); border-color: var(--border); }

    .theme-toggle-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(180deg, var(--blue), #1d4ed8);
      box-shadow: 0 4px 10px rgba(37,99,235,.4);
      display: grid;
      place-items: center;
      position: relative;
      transform: translateX(0);
      transition: transform .25s cubic-bezier(.4,0,.2,1);
      color: #fff;
    }
    .theme-toggle[aria-checked="true"] .theme-toggle-thumb { transform: translateX(24px); }

    .theme-toggle-thumb svg {
      width: 12px;
      height: 12px;
      position: absolute;
      opacity: 0;
      transition: opacity .15s ease;
    }
    .theme-toggle[aria-checked="false"] .icon-moon { opacity: 1; }
    .theme-toggle[aria-checked="true"] .icon-sun { opacity: 1; }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
      animation: fadeDown .6s ease both;
    }

    .logo {
      width: 48px; height: 48px;
      border-radius: 16px;
      background: linear-gradient(180deg, var(--blue), #1b3faa);
      display: grid;
      place-items: center;
      font-family: 'Syne', sans-serif;
      font-weight: 900;
      font-size: 22px;
      color: #fff;
      box-shadow: 0 10px 30px rgba(37,99,235,.35), 0 0 0 1px rgba(37,99,235,.25);
      flex-shrink: 0;
    }

    .brand-text .name {
      font-family: 'Syne', sans-serif;
      font-weight: 900;
      font-size: 24px;
      letter-spacing: -.03em;
      color: #fff;
    }
    body.light .brand-text .name { color: var(--text); }
    .brand-text .tag { font-size: 12px; color: var(--muted2); margin-top: 2px; font-weight: 500; }

    .card {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(180deg, rgba(11,18,32,.96), rgba(8,14,28,.92));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      box-shadow: 0 24px 64px rgba(0,0,0,.5), 0 0 0 1px rgba(37,99,235,.06) inset;
      display: flex;
      flex-direction: column;
      max-height: 80vh;
      overflow: hidden;
      animation: fadeUp .6s ease both .1s;
      position: relative;
      z-index: 1;
    }
    body.light .card {
      background: #fff;
      border-color: var(--border);
      box-shadow: 0 20px 50px rgba(15,23,42,.10), 0 0 0 1px rgba(37,99,235,.04) inset;
    }

    .card-head {
      padding: 20px 24px 0;
    }

    .form-body {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
    }
    .form-body::-webkit-scrollbar { width: 6px; }
    .form-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    body.light .form-body::-webkit-scrollbar-thumb { background: rgba(15,23,42,.15); }

    .form-title {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -.02em;
      margin-bottom: 6px;
    }
    body.light .form-title { color: var(--text); }
    .form-subtitle { font-size: 13px; color: var(--muted2); margin-bottom: 24px; line-height: 1.5; }

    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: .03em;
      text-transform: uppercase;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(2,6,23,.5);
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      outline: none;
      font-family: 'DM Sans', sans-serif;
      transition: .2s ease;
    }
    body.light .field input { border-color: var(--border); background: var(--panel-2); }
    .field input::placeholder { color: var(--muted2); font-weight: 400; }
    .field input:focus {
      border-color: rgba(37,99,235,.55);
      box-shadow: 0 0 0 4px rgba(37,99,235,.12);
    }

    .submit-btn {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1px solid rgba(37,99,235,.45);
      background: linear-gradient(180deg, var(--blue), #1d4ed8);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
      box-shadow: 0 8px 24px rgba(37,99,235,.2);
      margin-top: 20px;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: .01em;
      position: relative;
      overflow: hidden;
    }
    .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(37,99,235,.3); }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: .7; cursor: default; transform: none; }

    .view-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .view-btn {
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(2,6,23,.45);
      border-radius: 14px;
      padding: 18px 12px;
      cursor: pointer;
      transition: .2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      position: relative;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
    }
    body.light .view-btn { border-color: var(--border); background: var(--panel-2); }
    .view-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .view-btn.admin::before { background: radial-gradient(circle at center, rgba(37,99,235,.15), transparent 70%); }
    .view-btn.comercial::before { background: radial-gradient(circle at center, rgba(139,92,246,.15), transparent 70%); }
    .view-btn:hover::before { opacity: 1; }
    .view-btn.admin:hover { border-color: rgba(37,99,235,.5); color: #fff; }
    .view-btn.comercial:hover { border-color: rgba(139,92,246,.5); color: #fff; }
    body.light .view-btn.admin:hover, body.light .view-btn.comercial:hover { color: var(--text); }
    .view-btn .view-name { font-weight: 800; font-size: 14px; letter-spacing: -.01em; }
    .view-btn .view-desc { font-size: 11px; color: var(--muted2); text-align: center; line-height: 1.3; }

    .alert {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 14px;
      display: none;
      animation: fadeIn .2s ease;
    }
    .alert.error {
      background: rgba(220,38,38,.12);
      border: 1px solid rgba(220,38,38,.3);
      color: #fca5a5;
    }
    body.light .alert.error {
      background: rgba(220,38,38,.08);
      border-color: rgba(220,38,38,.25);
      color: #b91c1c;
    }
    .alert.success {
      background: rgba(16,185,129,.12);
      border: 1px solid rgba(16,185,129,.3);
      color: #6ee7b7;
    }
    body.light .alert.success {
      background: rgba(16,185,129,.08);
      border-color: rgba(16,185,129,.25);
      color: #047857;
    }
    .alert.show { display: block; }

    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--muted2);
      animation: fadeUp .6s ease both .25s;
      position: relative;
      z-index: 1;
    }
    .footer a { color: var(--muted); text-decoration: none; }
    .footer a:hover { color: var(--text); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .panel { display: none; }
    .panel.active { display: block; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 28px;
      animation: fadeDown .6s ease both .05s;
      position: relative;
      z-index: 1;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 0 3px rgba(16,185,129,.15);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(.9); opacity: .9; }
      50%  { transform: scale(1.15); opacity: .6; }
      100% { transform: scale(.9); opacity: .9; }
    }

    .field-wrap { position: relative; }
    .field-wrap input { padding-right: 40px; }
    .toggle-pwd {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted2);
      cursor: pointer;
      font-size: 14px;
      padding: 2px;
      line-height: 1;
    }
    .toggle-pwd:hover { color: var(--muted); }

    .mono {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted2);
      letter-spacing: .04em;
    }

    .theme-toggle:focus-visible,
    .view-btn:focus-visible,
    .submit-btn:focus-visible,
    .toggle-pwd:focus-visible,
    .footer a:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
      border-radius: 8px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    @media (max-width: 380px) {
      body { padding-left: 16px; padding-right: 16px; }
      .form-body { padding: 20px; }
      .logo { width: 42px; height: 42px; font-size: 19px; }
      .brand-text .name { font-size: 21px; }
      .brand { gap: 12px; margin-bottom: 24px; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <button class="theme-toggle" id="themeToggle" type="button" role="switch" aria-checked="false" aria-label="Cambiar tema">
    <span class="theme-toggle-thumb">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4.2"/>
        <line x1="12" y1="1.5" x2="12" y2="4"/>
        <line x1="12" y1="20" x2="12" y2="22.5"/>
        <line x1="1.5" y1="12" x2="4" y2="12"/>
        <line x1="20" y1="12" x2="22.5" y2="12"/>
        <line x1="4.2" y1="4.2" x2="6" y2="6"/>
        <line x1="18" y1="18" x2="19.8" y2="19.8"/>
        <line x1="4.2" y1="19.8" x2="6" y2="18"/>
        <line x1="18" y1="6" x2="19.8" y2="4.2"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 3a9 9 0 108.485 12.02A7 7 0 0112 3z"/>
      </svg>
    </span>
  </button>

  <div class="brand">
    <div class="logo">W</div>
    <div class="brand-text">
      <div class="name">WINALLCONTROL</div>
      <div class="tag">Plataforma de gestión comercial</div>
    </div>
  </div>

  <div class="status-bar">
    <span class="dot"></span>
    <span>Sistema operativo · <span class="mono">v1.0</span></span>
  </div>

  <div class="card">
    <div class="form-body panel active" id="panel-login">
      <div class="form-title">Bienvenido de nuevo</div>
      <div class="form-subtitle">Ingresá tus credenciales para continuar.</div>

      <div class="field">
        <label>Email</label>
        <input id="login-email" type="email" placeholder="tu@email.com" autocomplete="email" />
      </div>

      <div class="field">
        <label>Contraseña</label>
        <div class="field-wrap">
          <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" />
          <button class="toggle-pwd" id="toggle-login-pwd" type="button" tabindex="-1">Show</button>
        </div>
      </div>

      <div class="alert" id="login-alert"></div>

      <button class="submit-btn" id="login-btn" type="button">Ingresar al sistema</button>
    </div>

    <div class="form-body panel" id="panel-view">
      <div class="form-title" id="view-title">Elegí tu vista</div>
      <div class="form-subtitle">Tenés acceso a más de un panel. Podés cambiar cerrando sesión.</div>

      <div class="view-selector">
        <button class="view-btn admin" data-view="admin" type="button">
          <div class="view-name">Admin</div>
          <div class="view-desc">Control global y dirección</div>
        </button>
        <button class="view-btn comercial" data-view="comercial" type="button">
          <div class="view-name">Comercial</div>
          <div class="view-desc">Gestión de visitas y leads</div>
        </button>
      </div>
    </div>
  </div>

  <div class="footer">
    Wincontrol · Control operativo &nbsp;·&nbsp;
    <a href="#">Soporte</a>
  </div>

  <script src="./config.js"></script>

  <script>
    const THEME_KEY = 'wc-theme';
    const ROUTES = { admin: '../admin/', comercial: '../comercial/' };

    const themeToggle = document.getElementById('themeToggle');

    function applyTheme(theme) {
      document.body.classList.toggle('light', theme === 'light');
      themeToggle.setAttribute('aria-checked', theme === 'light');
    }

    applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

    themeToggle.addEventListener('click', () => {
      const next = document.body.classList.contains('light') ? 'dark' : 'light';
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });

    document.getElementById('toggle-login-pwd').addEventListener('click', (e) => {
      const input = document.getElementById('login-password');
      const shown = input.type === 'text';
      input.type = shown ? 'password' : 'text';
      e.currentTarget.textContent = shown ? 'Show' : 'Hide';
    });

    function showAlert(id, msg, type) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.className = 'alert ' + (type || 'error') + ' show';
    }

    function clearAlert(id) {
      const el = document.getElementById(id);
      el.className = 'alert';
      el.textContent = '';
    }

    function vistasDisponibles(roles) {
      const vistas = [];
      if (roles.includes('MASTER') || roles.includes('ADMIN')) vistas.push('admin');
      if (roles.includes('COMERCIAL')) vistas.push('comercial');
      return vistas;
    }

    function redirectTo(vista) {
      localStorage.setItem('wc_role', vista);
      localStorage.setItem('wc_view', vista);
      const card = document.querySelector('.card');
      const brand = document.querySelector('.brand');
      card.style.transition = 'opacity .3s ease, transform .3s ease';
      card.style.opacity = '0';
      card.style.transform = 'translateY(-8px)';
      brand.style.transition = 'opacity .3s ease';
      brand.style.opacity = '0';
      setTimeout(() => { window.location.href = ROUTES[vista]; }, 320);
    }

    function mostrarSelectorDeVista(nombre) {
      document.getElementById('panel-login').classList.remove('active');
      document.getElementById('panel-view').classList.add('active');
      document.getElementById('view-title').textContent = 'Hola, ' + nombre.split(' ')[0];
    }

    document.querySelectorAll('.view-btn').forEach((btn) => {
      btn.addEventListener('click', () => redirectTo(btn.dataset.view));
    });

    async function handleLogin() {
      clearAlert('login-alert');

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email) return showAlert('login-alert', 'Ingresá tu email.');
      if (!password) return showAlert('login-alert', 'Ingresá tu contraseña.');

      const btn = document.getElementById('login-btn');
      btn.innerHTML = '<span class="spinner"></span>Verificando...';
      btn.disabled = true;

      try {
        const res = await fetch(CONFIG.API_URL + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Credenciales incorrectas');

        const roles = data.user.roles || [];
        const vistas = vistasDisponibles(roles);

        if (vistas.length === 0) {
          throw new Error('Tu cuenta no tiene un panel asignado. Contactá al administrador.');
        }

        localStorage.setItem('wc_token', data.token);
        localStorage.setItem('wc_user', JSON.stringify(data.user));
        localStorage.setItem('wc_roles', JSON.stringify(roles));
        localStorage.setItem('wc_empresa_id', data.user.empresaId === null ? '' : String(data.user.empresaId));

        if (vistas.length === 1) {
          showAlert('login-alert', 'Acceso correcto. Redirigiendo...', 'success');
          setTimeout(() => redirectTo(vistas[0]), 700);
          return;
        }

        mostrarSelectorDeVista(data.user.name || '');
      } catch (err) {
        showAlert('login-alert', err.message);
        btn.innerHTML = 'Ingresar al sistema';
        btn.disabled = false;
      }
    }

    document.getElementById('login-btn').addEventListener('click', handleLogin);

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      if (document.getElementById('panel-login').classList.contains('active')) handleLogin();
    });
  </script>
</body>
</html>
